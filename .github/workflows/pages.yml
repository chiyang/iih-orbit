name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and build the static site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript and Angular templates
        run: npm run check
      - name: Run tests
        run: |
          if npm test > "$RUNNER_TEMP/orbit-tests.log" 2>&1; then
            cat "$RUNNER_TEMP/orbit-tests.log"
          else
            cat "$RUNNER_TEMP/orbit-tests.log"
            node --input-type=module - "$RUNNER_TEMP/orbit-tests.log" <<'NODE'
          import { readFileSync } from 'node:fs';
          const log = readFileSync(process.argv[2], 'utf8');
          const failures = log.lastIndexOf('✖ failing tests:');
          const detail = (failures < 0 ? log.slice(-10000) : log.slice(failures)).slice(0, 10000);
          const escaped = detail.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
          console.log(`::error title=Test failures::${escaped}`);
          NODE
            exit 1
          fi
      - name: Build for GitHub Pages
        run: npm run build:pages
      - name: Upload the static site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/orbit-project-manager/browser

  deploy:
    name: Deploy the static site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
