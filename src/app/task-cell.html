@if (field() === 'status') {
  <div class="status-cell" (click)="$event.stopPropagation()" (keydown.escape)="cancel($event)">
    <select class="cell-status" [orbitColor]="status()?.color || 'gray'" [attr.aria-label]="task().title + '的狀態'" [ngModel]="editing() ? value : task().status" [disabled]="busy() || store.pendingWrites() > 0" (focus)="begin()" (ngModelChange)="selectStatus($event)">
      @for (status of store.statuses(); track status.id) {<option [value]="status.id">{{ status.label }}</option>}
    </select>
    @if (error()) {<div class="cell-error" role="alert">{{ error() }}<button type="button" (click)="reload()">載入最新</button><button type="button" (click)="cancel()">取消</button></div>}
  </div>
} @else if (editing()) {
  <form class="cell-editor" (ngSubmit)="save()" (click)="$event.stopPropagation()" (keydown.escape)="cancel($event)">
    @if (field() === 'title') {<input name="value" type="text" aria-label="任務名稱" [(ngModel)]="value" maxlength="100" [disabled]="busy()" appCellFocus>}
    @else if (dateField()) {
      <label>{{ label() }}<input name="value" type="date" [attr.aria-label]="label()" [(ngModel)]="value" [disabled]="busy()" appCellFocus></label>
      <label class="time-choice"><input name="includeTime" type="checkbox" [ngModel]="includeTime" (ngModelChange)="toggleTime($event)" [disabled]="busy() || !value">加入時間</label>
      @if (includeTime && value) {<input name="time" type="time" [attr.aria-label]="label() + '的時間'" [(ngModel)]="time" [disabled]="busy()">}
    } @else {
      <select name="value" [attr.aria-label]="label()" [(ngModel)]="value" [disabled]="busy()" appCellFocus>
        @switch (field()) {
          @case ('projectId') {<option value="">未指定專案</option>@for (project of store.projects(); track project.id) {<option [value]="project.id">{{ project.name }}{{ project.archived ? '（已封存）' : '' }}</option>}}
          @case ('categoryId') {<option value="">未分類</option>@for (category of store.categories(); track category.id) {<option [value]="category.id">{{ category.name }}</option>}}
          @case ('priority') {@for (priority of priorities; track priority.id) {<option [value]="priority.id">{{ priority.label }}</option>}}
        }
      </select>
    }
    @if (error()) {<div class="cell-error" role="alert">{{ error() }}<button type="button" [disabled]="busy()" (click)="reload()">載入最新</button></div>}
    <div class="cell-actions"><button type="submit" [disabled]="busy() || store.pendingWrites() > 0">{{ busy() ? '儲存中…' : '儲存' }}</button><button type="button" [disabled]="busy()" (click)="cancel()">取消</button></div>
  </form>
} @else {
  <button type="button" class="cell-value" [class.title-value]="field() === 'title'" [class.category-value]="field() === 'categoryId'" [class.project-value]="field() === 'projectId'" [class.overdue]="overdue()" [attr.data-priority]="field() === 'priority' ? task().priority : null" [orbitColor]="field() === 'categoryId' ? category()?.color || 'gray' : 'gray'" [attr.aria-label]="'修改「' + task().title + '」的' + label()" [title]="'點擊修改' + label()" (click)="$event.stopPropagation(); begin()">
    @if (field() === 'categoryId') {<i></i>}@if (field() === 'projectId') {<app-icon name="tag" />}@if (field() === 'priority') {<app-icon name="flag" />}<span>{{ display() }}</span>@if (overdue()) {<small>逾期</small>}
  </button>
}
