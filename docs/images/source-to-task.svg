<svg xmlns="http://www.w3.org/2000/svg" width="1728" height="1280" viewBox="0 0 1728 1280" role="img" aria-labelledby="title description">
  <title id="title">把工作來源，變成下一個任務</title>
  <desc id="description">Gmail 郵件與 Google Drive 檔案可拖到工作區空白落點，建立任務並保留來源資訊連結；拖到既有任務卡片中央則加入連結。Google Calendar 活動目前需從明細點選複製為 Orbit 任務並確認，建立各自編輯的獨立任務。此圖為操作示意，不是實際 App 截圖。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-35%" width="150%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#234a40" flood-opacity=".08" /></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="m2 2 7 4-7 4" fill="none" stroke="#59796a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></marker>
    <symbol id="mail" viewBox="0 0 32 32"><rect x="3" y="6" width="26" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="2" /><path d="m4 8 12 9L28 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></symbol>
    <symbol id="file" viewBox="0 0 32 32"><path d="M8 3h11l7 7v18H8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /><path d="M18 3v8h8M12 17h10M12 22h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></symbol>
    <symbol id="calendar" viewBox="0 0 32 32"><rect x="4" y="6" width="24" height="23" rx="4" fill="none" stroke="currentColor" stroke-width="2" /><path d="M4 13h24M10 3v7M22 3v7M10 19h3M18 19h3M10 24h3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></symbol>
    <symbol id="link" viewBox="0 0 32 32"><path d="m14 10 4-4a6 6 0 0 1 8 8l-5 5a6 6 0 0 1-8 0M18 22l-4 4a6 6 0 0 1-8-8l5-5a6 6 0 0 1 8 0M11 21l10-10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></symbol>
    <symbol id="cursor" viewBox="0 0 42 50"><path d="m7 3 29 24-14 2 7 15-8 3-7-16-9 10Z" fill="#31584b" stroke="#fff" stroke-width="3" stroke-linejoin="round" /></symbol>
    <symbol id="check" viewBox="0 0 28 28"><circle cx="14" cy="14" r="13" fill="#dfece4" /><path d="m7 14 5 5 9-10" fill="none" stroke="#31584b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></symbol>
    <style>
      text {font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; fill: #24493e;}
      .title {font-size: 48px; font-weight: 750; letter-spacing: 1px;}
      .subtitle {font-size: 25px; fill: #587268;}
      .column {font-size: 22px; font-weight: 650; fill: #6b7e75; letter-spacing: 2px;}
      .service {font-size: 27px; font-weight: 700;}
      .card-title {font-size: 27px; font-weight: 650;}
      .body {font-size: 22px; fill: #67796f;}
      .action {font-size: 24px; font-weight: 700;}
      .small {font-size: 20px; fill: #718278;}
      .chip {font-size: 23px; font-weight: 600;}
      .outcome {font-size: 23px; font-weight: 650;}
    </style>
  </defs>
  <rect width="1728" height="1280" fill="#f6f6ef" />
  <path d="M1455-150c380 155 280 405-22 331" fill="none" stroke="#e1e8dc" stroke-width="2" /><circle cx="1614" cy="117" r="9" fill="#9ab6a2" />
  <text x="64" y="84" class="title">把工作來源，變成下一個任務</text>
  <text x="66" y="132" class="subtitle">Gmail 與 Drive 拖曳建立並連結來源；Calendar 活動點選複製。</text>
  <text x="1664" y="80" text-anchor="end" font-size="22" font-weight="650">IIh Orbit</text>
  <text x="1664" y="115" text-anchor="end" class="small">操作示意圖</text>
  <text x="90" y="192" class="column">① 選擇工作來源</text>
  <text x="646" y="192" class="column">② 操作</text>
  <text x="992" y="192" class="column">③ 建立 Orbit 任務</text>

  <rect x="64" y="218" width="1600" height="230" rx="24" fill="#fff" stroke="#dce4db" />
  <g transform="translate(90 242)">
    <rect width="440" height="184" rx="16" fill="#fff" stroke="#d7e1d7" />
    <rect x="20" y="18" width="46" height="46" rx="13" fill="#f4ebe5" /><use href="#mail" x="29" y="27" width="28" height="28" color="#b06a50" />
    <text x="82" y="50" class="service">Email / Gmail</text>
    <text x="22" y="104" class="card-title">共創工作坊場地確認</text>
    <text x="22" y="140" class="body">場地與設備已確認，請核對活動流程。</text>
    <text x="22" y="170" class="small">共創夥伴 · 09:20</text>
  </g>
  <path d="M554 334H930" fill="none" stroke="#59796a" stroke-width="3" stroke-dasharray="5 10" marker-end="url(#arrow)" />
  <g transform="translate(591 271) rotate(-4 135 35)" filter="url(#shadow)" opacity=".88"><rect width="280" height="74" rx="14" fill="#edf3ec" stroke="#9ab3a1" /><use href="#mail" x="16" y="23" width="28" height="28" color="#6c8c78" /><text x="56" y="45" font-size="22" font-weight="600">共創工作坊場地確認</text></g>
  <use href="#cursor" x="815" y="323" width="42" height="50" />
  <text x="746" y="396" text-anchor="middle" class="action">拖到空白落點，放開</text>
  <g transform="translate(972 242)" filter="url(#shadow)">
    <rect width="666" height="184" rx="17" fill="#f8faf6" stroke="#aec2b2" stroke-width="2" />
    <rect width="6" height="154" y="15" rx="3" fill="#7da18b" />
    <use href="#check" x="22" y="20" width="27" height="27" /><text x="61" y="43" class="outcome">已建立任務</text>
    <text x="26" y="92" class="card-title">共創工作坊場地確認</text>
    <text x="26" y="143" class="small">資訊連結</text>
    <rect x="132" y="117" width="238" height="43" rx="10" fill="#e7eee7" /><use href="#link" x="143" y="126" width="25" height="25" color="#31584b" /><text x="178" y="146" class="chip">Gmail 原信 ↗</text>
    <text x="640" y="43" text-anchor="end" class="small">保留原信入口</text>
  </g>

  <rect x="64" y="474" width="1600" height="230" rx="24" fill="#fff" stroke="#dce4db" />
  <g transform="translate(90 498)">
    <rect width="440" height="184" rx="16" fill="#fff" stroke="#d7e1d7" />
    <rect x="20" y="18" width="46" height="46" rx="13" fill="#e8efe8" /><use href="#file" x="29" y="26" width="28" height="28" color="#648971" />
    <text x="82" y="50" class="service">Google Drive</text>
    <text x="22" y="104" class="card-title">共創工作坊流程.pdf</text>
    <text x="22" y="140" class="body">活動資料 / 共創工作坊</text>
    <text x="22" y="170" class="small">檔案</text>
  </g>
  <path d="M554 590H930" fill="none" stroke="#59796a" stroke-width="3" stroke-dasharray="5 10" marker-end="url(#arrow)" />
  <g transform="translate(591 527) rotate(-4 135 35)" filter="url(#shadow)" opacity=".88"><rect width="280" height="74" rx="14" fill="#edf3ec" stroke="#9ab3a1" /><use href="#file" x="16" y="23" width="28" height="28" color="#6c8c78" /><text x="56" y="45" font-size="22" font-weight="600">共創工作坊流程.pdf</text></g>
  <use href="#cursor" x="815" y="579" width="42" height="50" />
  <text x="746" y="652" text-anchor="middle" class="action">拖到空白落點，放開</text>
  <g transform="translate(972 498)" filter="url(#shadow)">
    <rect width="666" height="184" rx="17" fill="#f8faf6" stroke="#aec2b2" stroke-width="2" />
    <rect width="6" height="154" y="15" rx="3" fill="#7da18b" />
    <use href="#check" x="22" y="20" width="27" height="27" /><text x="61" y="43" class="outcome">已建立任務</text>
    <text x="26" y="92" class="card-title">共創工作坊流程.pdf</text>
    <text x="26" y="143" class="small">資訊連結</text>
    <rect x="132" y="117" width="238" height="43" rx="10" fill="#e7eee7" /><use href="#link" x="143" y="126" width="25" height="25" color="#31584b" /><text x="178" y="146" class="chip">Drive 檔案 ↗</text>
    <text x="640" y="43" text-anchor="end" class="small">隨時開啟來源檔案</text>
  </g>

  <rect x="64" y="730" width="1600" height="230" rx="24" fill="#fff" stroke="#dce4db" />
  <g transform="translate(90 754)">
    <rect width="440" height="184" rx="16" fill="#fff" stroke="#d7e1d7" />
    <rect x="20" y="18" width="46" height="46" rx="13" fill="#e9eef6" /><use href="#calendar" x="29" y="26" width="28" height="28" color="#6b8eaf" />
    <text x="82" y="50" class="service">Google Calendar</text>
    <text x="22" y="104" class="card-title">研究進度交流</text>
    <text x="22" y="140" class="body">10 月 21 日 · 14:00–15:30</text>
    <text x="22" y="170" class="small">Google 活動明細</text>
  </g>
  <path d="M554 846H930" fill="none" stroke="#59796a" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="576" y="796" width="326" height="60" rx="12" fill="#31584b" /><text x="739" y="835" text-anchor="middle" font-size="24" font-weight="650" fill="#fff" style="fill:#fff">複製為 Orbit 任務</text>
  <use href="#cursor" x="849" y="841" width="42" height="50" />
  <text x="746" y="908" text-anchor="middle" class="action">點選複製，再確認</text>
  <g transform="translate(972 754)" filter="url(#shadow)">
    <rect width="666" height="184" rx="17" fill="#f6f8fb" stroke="#b8c8da" stroke-width="2" />
    <rect width="6" height="154" y="15" rx="3" fill="#8aa3bc" />
    <use href="#check" x="22" y="20" width="27" height="27" /><text x="61" y="43" class="outcome">已建立獨立任務</text>
    <text x="26" y="92" class="card-title">研究進度交流</text>
    <text x="26" y="134" class="body">10 月 21 日 · 14:00–15:30</text>
    <text x="26" y="165" class="small">原活動保留，兩邊各自編輯</text>
  </g>

  <rect x="64" y="1002" width="1600" height="192" rx="24" fill="#244b40" />
  <use href="#link" x="94" y="1033" width="34" height="34" color="#d6e6da" />
  <text x="145" y="1061" font-size="31" font-weight="700" style="fill:#fff">也能連到既有任務</text>
  <text x="97" y="1110" font-size="27" style="fill:#e6eee6">把 Email 或 Drive 檔案拖到任務卡片中央</text>
  <text x="97" y="1154" font-size="24" style="fill:#bcd2c2">加入資訊連結，保留原任務的內容與時程。</text>
  <path d="M844 1100h88" fill="none" stroke="#a6c0ae" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="971" y="1033" width="660" height="129" rx="17" fill="#f6f8f1" />
  <text x="997" y="1074" font-size="27" font-weight="650">工作坊籌備</text>
  <text x="997" y="1127" class="small">資訊連結</text>
  <rect x="1104" y="1096" width="214" height="45" rx="10" fill="#e4ece3" /><use href="#mail" x="1118" y="1106" width="26" height="26" color="#31584b" /><text x="1155" y="1128" class="chip">Gmail 原信 ↗</text>
  <rect x="1330" y="1096" width="272" height="45" rx="10" fill="#e4ece3" /><use href="#file" x="1344" y="1105" width="26" height="26" color="#31584b" /><text x="1381" y="1128" class="chip">工作坊流程.pdf ↗</text>
  <text x="66" y="1244" class="small">來源保留，工作脈絡跟著任務走。</text>
  <text x="1664" y="1244" text-anchor="end" class="small">Gmail / Drive：拖曳連結　·　Calendar：確認複製</text>
</svg>
